# Tempo single binary; Pulse services send traces over OTLP gRPC to tempo.monitoring:4317
tempo:
  retention: 48h
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 768Mi }
  # The chart's default 1 GiB ballast is bigger than the 768Mi limit: Tempo sat at the limit and spent
  # its CPU on garbage collection. GOMEMLIMIT makes the Go GC work harder before the limit instead.
  memBallastSizeMbs: 0
  extraEnv:
    - name: GOMEMLIMIT
      value: 600MiB
  # /ready can stay 503 for a while after a start; probing it for liveness restarted Tempo
  # before it got there. Liveness only checks the process is up; readiness still uses /ready.
  livenessProbe:
    httpGet: null
    tcpSocket: { port: 3200 }
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6

persistence:
  enabled: true
  size: 2Gi
