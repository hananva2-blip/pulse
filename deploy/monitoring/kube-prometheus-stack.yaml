# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics

prometheus:
  prometheusSpec:
    retention: 2d
    # Select ServiceMonitors and rules from every namespace, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    # Keep the heaviest pod off the control-plane node: when it shared the node with the
    # API server, slow API responses made KEDA lose its leader lease and Tempo fail probes
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [prometheus.localhost]

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [alertmanager.localhost]

grafana:
  # Local development only
  adminPassword: pulse-dev
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localhost]
  sidecar:
    dashboards:
      # Load dashboards from ConfigMaps labelled grafana_dashboard=1 in any namespace (Pulse ships one)
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      jsonData:
        # A trace_id in a log line becomes a link to the trace in Tempo
        derivedFields:
          - name: trace_id
            matcherRegex: 'trace_id=([0-9a-f]{32})'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus

# K3s runs these inside the k3s binary; there is nothing separate to scrape
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
