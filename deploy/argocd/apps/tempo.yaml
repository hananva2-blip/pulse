apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    # Diff with a server-side dry run, so defaults the API server adds (e.g. CRD defaults) are not drift
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  # The chart comes from its Helm repo at a pinned version; the values come from this Git repo
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/deploy/monitoring/tempo.yaml
    - repoURL: https://github.com/hananva2-blip/pulse.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large CRDs exceed the annotation size limit of client-side apply
      - ServerSideApply=true
