apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    # Diff with a server-side dry run, so defaults the API server adds (e.g. CRD defaults) are not drift
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # Wave -1: the Rollout CRD exists before the Pulse chart renders one
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          replicas: 1
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
