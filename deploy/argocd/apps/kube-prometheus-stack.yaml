apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Diff with a server-side dry run, so defaults the API server adds (e.g. CRD defaults) are not drift
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    # Wave -1: the Prometheus Operator CRDs exist before apps that ship ServiceMonitors
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  # The chart comes from its Helm repo at a pinned version; the values come from this Git repo
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/deploy/monitoring/kube-prometheus-stack.yaml
    - repoURL: https://github.com/hananva2-blip/pulse.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large CRDs exceed the annotation size limit of client-side apply
      - ServerSideApply=true
