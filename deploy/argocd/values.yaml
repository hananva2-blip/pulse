# Argo CD install values (chart argo/argo-cd, version pinned in bootstrap.sh)

configs:
  params:
    # TLS ends at the ingress; Argo CD itself serves plain HTTP inside the cluster
    server.insecure: true

# Not used here: no SSO, no notifications. Saves memory on the local cluster.
dex:
  enabled: false
notifications:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    # *.localhost resolves to 127.0.0.1: http://argocd.localhost:8880
    hostname: argocd.localhost
