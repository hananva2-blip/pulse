{{/* One ScaledObject per runner kind, each scaling on the backlog of its own NATS consumer */}}
{{- $runners := dict "runner" (dict "values" .Values.runner "consumer" "http-runners")
                     "browser-runner" (dict "values" .Values.browserRunner "consumer" "browser-runners") }}
{{- range $component, $r := $runners }}
{{- if include "pulse.autoscaled" (list $ $r.values) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels: {{- include "pulse.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $.Release.Name }}-{{ $component }}
  minReplicaCount: {{ $r.values.autoscaling.minReplicas }}
  maxReplicaCount: {{ $r.values.autoscaling.maxReplicas }}
  pollingInterval: 10
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Scale down slowly so a short lull does not drop runners that are needed again
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    # Number of jobs waiting in the consumer this runner kind pulls from
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $.Release.Name }}-nats.{{ $.Release.Namespace }}.svc.cluster.local:8222
        account: "$G"
        stream: CHECKS
        consumer: {{ $r.consumer }}
        lagThreshold: {{ $r.values.autoscaling.lagThreshold | quote }}
{{- end }}
{{- end }}
