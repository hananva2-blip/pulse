image:
  registry: ghcr.io/hananva2-blip
  # Commit SHA of the images built by CI
  tag: fe13b775725ddb92fe3df8be1ca8a8c9a14a6b69
  pullPolicy: IfNotPresent

api:
  replicas: 2
  # Share of /api/ requests that fail on purpose (canary demos); 0 in normal operation
  faultInjectionRate: 0
  canary:
    # Used when Argo Rollouts is installed; a plain Deployment otherwise
    enabled: true
    maxErrorRate: 0.05
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

scheduler:
  # More than one is safe: claims use FOR UPDATE SKIP LOCKED
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

runner:
  # Used only when KEDA is not installed
  replicas: 2
  batchSize: 10
  autoscaling:
    # Scale on the backlog of the NATS consumer the runners share
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    # Target number of waiting jobs per runner
    lagThreshold: 20
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }

ingress:
  enabled: true
  className: traefik
  # Empty host matches any host: http://localhost:8880 on the local k3d cluster
  host: ""

postgres:
  image: postgres:16-alpine
  database: pulse
  user: pulse
  # Local development only; a later stage moves this to AWS Secrets Manager
  password: pulse-dev
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

nats:
  image: nats:2.10-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

monitoring:
  # ServiceMonitors, alert rules and the Grafana dashboard; skipped if the Prometheus Operator is absent
  enabled: true

tracing:
  # OTLP gRPC endpoint of Tempo; leave empty to turn tracing off
  endpoint: http://tempo.monitoring:4317

testTarget:
  # A small HTTP test server inside the cluster (/status/500, /delay/2, ...), so load tests
  # and end-to-end tests do not depend on sites on the internet
  enabled: true
  image: mccutchen/go-httpbin:v2.15.0
